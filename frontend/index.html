<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Code Guardian | OX Security</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #F5F6FA; -webkit-font-smoothing: antialiased; }
      input:focus { border-color: #4318FF !important; box-shadow: 0 0 0 3px rgba(67, 24, 255, 0.12); }
      button:not(:disabled):hover { filter: brightness(1.08); transform: translateY(-1px); }
      a:hover { text-decoration: underline !important; }
      tr:hover td { background: rgba(67, 24, 255, 0.03); }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>

    <script type="module" src="/src/main.tsx"></script>
