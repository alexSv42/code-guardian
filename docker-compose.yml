services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: code_guardian
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: guardian
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d code_guardian"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  trivy:
    image: aquasec/trivy:latest
    command: ["server", "--listen", "0.0.0.0:4954"]
    ports:
      - "4954:4954"

  app:
    build: .
    mem_limit: 200m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      trivy:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://guardian:guardian@postgres:5432/code_guardian
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TRIVY_SERVER_URL: http://trivy:4954
      PORT: 3000
    ports:
      - "3000:3000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - app

volumes:
  pgdata:
